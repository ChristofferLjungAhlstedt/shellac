[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellac"
version = "0.1.0"
description = "A good-looking Linux terminal emulator with fast pane splitting and a file tree sidebar (GTK4, libadwaita, VTE)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Christoffer Ljung Ahlstedt" }]
requires-python = ">=3.11"
# PyGObject is deliberately not listed: it must come from the distro
# (python3-gi) together with the GTK, libadwaita and VTE typelibs.
# Install with `pipx install --system-site-packages .`
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
shellac = "shellac.__main__:main"

[tool.setuptools.packages.find]
include = ["shellac*"]

[tool.setuptools.package-data]
shellac = ["resources/themes/*.toml", "resources/icons/hicolor/index.theme", "resources/icons/hicolor/scalable/actions/*.svg", "resources/icons/hicolor/scalable/apps/*.svg", "resources/icons/hicolor/scalable/mimetypes/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The shell snippet is a single dense zsh line by design.
"shellac/shell_integration.py" = ["E501"]
